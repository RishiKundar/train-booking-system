server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/mydb?currentSchema=user_service
    username: app_project
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: PT15M
  refresh-token-expiry: P30D
