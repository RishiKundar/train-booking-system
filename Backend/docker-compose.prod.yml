networks:
  train-booking-network:
    driver: bridge

services:

  # ─────────────────────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: train-booking/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      TRAIN_SERVICE_URL: http://train-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    networks:
      - train-booking-network
    depends_on:
      - user-service
      - train-service
      - booking-service
      - payment-service
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # User Service
  # ─────────────────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: train-booking/user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_DB_URL: ${USER_DB_URL}
    networks:
      - train-booking-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Train Service
  # ─────────────────────────────────────────────────────────────────────────
  train-service:
    build:
      context: ./train-service
      dockerfile: Dockerfile
    image: train-booking/train-service:latest
    container_name: train-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TRAIN_DB_URL: ${TRAIN_DB_URL}
    networks:
      - train-booking-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Booking Service
  # ─────────────────────────────────────────────────────────────────────────
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    image: train-booking/booking-service:latest
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BOOKING_DB_URL: ${BOOKING_DB_URL}
      SERVICES_TRAIN_URL: http://train-service:8082
      KAFKA_BOOTSTRAP_SERVERS: ${UPSTASH_KAFKA_BROKER}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="${UPSTASH_KAFKA_USERNAME}" password="${UPSTASH_KAFKA_PASSWORD}";
    networks:
      - train-booking-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Payment Service
  # ─────────────────────────────────────────────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: train-booking/payment-service:latest
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYMENT_DB_URL: ${PAYMENT_DB_URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${UPSTASH_KAFKA_BROKER}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="${UPSTASH_KAFKA_USERNAME}" password="${UPSTASH_KAFKA_PASSWORD}";
    networks:
      - train-booking-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: train-booking/notification-service:latest
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: neon
      KAFKA_BOOTSTRAP_SERVERS: ${UPSTASH_KAFKA_BROKER}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="${UPSTASH_KAFKA_USERNAME}" password="${UPSTASH_KAFKA_PASSWORD}";
      USER_SERVICE_URL: http://user-service:8081
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USERNAME: 2369955d93f9cc
      SMTP_PASSWORD: 703ef2135426d3
      DEFAULT_FROM: trainbooking@test.com
    networks:
      - train-booking-network
    restart: unless-stopped


