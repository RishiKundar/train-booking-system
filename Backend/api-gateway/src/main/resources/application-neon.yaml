server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: train-service
          uri: http://localhost:8082
          predicates:
            - Path=/train/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/booking/**
